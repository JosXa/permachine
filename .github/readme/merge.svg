<svg xmlns="http://www.w3.org/2000/svg" width="860" height="300" viewBox="0 0 860 300" role="img" aria-label="config.base.json and config.{machine=laptop}.json merge into a gitignored config.json where the machine values win">
  <style>
    .card { fill: #ffffff; stroke: #d0d7de; }
    .file { fill: #f6f8fa; stroke: #d0d7de; }
    .out { fill: #F8F1FC; stroke: #994CC3; stroke-dasharray: 6 5; }
    .text { fill: #1f2328; }
    .muted { fill: #59636e; }
    .accent { fill: #7A35A8; }
    .pill { fill: #F1E6F9; }
    .wire { stroke: #994CC3; fill: none; stroke-width: 2; stroke-dasharray: 5 6; animation: flow 1.2s linear infinite; }
    .node { fill: #994CC3; }
    .node-icon { stroke: #ffffff; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    @media (prefers-color-scheme: dark) {
      .card { fill: #0d1117; stroke: #30363d; }
      .file { fill: #161b22; stroke: #30363d; }
      .out { fill: #241634; stroke: #B07AD6; }
      .text { fill: #e6edf3; }
      .muted { fill: #9198a1; }
      .accent { fill: #C792EA; }
      .pill { fill: #3B1D52; }
      .wire { stroke: #B07AD6; }
    }
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 14px; }
    .name { font-weight: 700; }
    .tag { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; }
    @keyframes flow { to { stroke-dashoffset: -22; } }
  </style>
  <rect class="card" x="0.5" y="0.5" width="859" height="299" rx="14"/>
  <rect class="file" x="24" y="24" width="300" height="116" rx="10"/>
  <text class="text name" x="40" y="52">config.base.json</text>
  <rect class="pill" x="262" y="38" width="48" height="20" rx="10"/><text class="accent tag" x="272" y="52">GIT</text>
  <text class="muted" x="40" y="82">"theme": "nightowl",</text>
  <text class="muted" x="40" y="104">"fontSize": 14</text>
  <rect class="file" x="24" y="160" width="300" height="116" rx="10"/>
  <text class="text name" x="40" y="188">config.{machine=laptop}.json</text>
  <rect class="pill" x="262" y="200" width="48" height="20" rx="10"/><text class="accent tag" x="272" y="214">GIT</text>
  <text class="accent" x="40" y="236">"fontSize": 16,</text>
  <text class="accent" x="40" y="258">"proxy": "http://proxy:8080"</text>
  <path class="wire" d="M324 82 C 380 82, 380 150, 418 150"/>
  <path class="wire" d="M324 218 C 380 218, 380 150, 418 150"/>
  <path class="wire" d="M482 150 L 532 150"/>
  <circle class="node" cx="450" cy="150" r="32"/>
  <g class="node-icon" transform="translate(438 138)">
    <circle cx="6" cy="18" r="3"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="6" r="3"/>
    <path d="M6 9v6"/><path d="M18 9a9 9 0 0 1-9 9"/>
  </g>
  <text class="muted tag" x="412" y="206">MERGE</text>
  <rect class="out" x="532" y="74" width="304" height="152" rx="10"/>
  <text class="text name" x="548" y="102">config.json</text>
  <rect class="pill" x="728" y="88" width="94" height="20" rx="10"/><text class="accent tag" x="738" y="102">GITIGNORED</text>
  <text class="muted" x="548" y="134">"theme": "nightowl",</text>
  <text class="accent" x="548" y="158">"fontSize": 16,</text>
  <text class="accent" x="548" y="182">"proxy": "http://proxy:8080"</text>
  <text class="muted tag" x="548" y="210">MACHINE VALUES WIN</text>
</svg>
